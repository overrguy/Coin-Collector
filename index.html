<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Collector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen arena, menu column on the left, currency pills top right, three coins spawn in the free space */
:root {
  --tile-a: #2f80ff;
  --tile-b: #2873f0;
  --ink: #0a1c4d;
  --panel: rgba(8, 24, 72, 0.62);
  --text: #ffffff;
  --gold-1: #ffe27a;
  --font-ui: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html {
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--tile-a);
}

body {
  height: 100%;
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  background-color: var(--tile-a);
  background-image: conic-gradient(var(--tile-b) 25%, var(--tile-a) 0 50%, var(--tile-b) 0 75%, var(--tile-a) 0);
  background-size: 110px 110px;
  color: var(--text);
  font-family: var(--font-ui);
  font-weight: 600;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  animation: scroll-bg 18s linear infinite;
}

@keyframes scroll-bg {
  to { background-position: 110px 110px; }
}

#arena {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ---------- Currency pills ---------- */
#hud {
  position: absolute;
  top: 12px;
  right: 0;
  display: flex;
  gap: 12px;
  align-items: center;
}

.pill {
  position: relative;
  display: flex;
  align-items: center;
  min-width: 128px;
  height: 42px;
  padding: 0 14px 0 44px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
}

.pill > svg {
  position: absolute;
  left: -8px;
  top: 50%;
  width: 46px;
  height: 46px;
  margin-top: -23px;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35));
}

.pill output {
  display: block;
  width: 100%;
  text-align: right;
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}

.pill.bump { animation: bump 160ms ease-out; }

@keyframes bump {
  40% { transform: scale(1.08); }
}

/* diamonds pill: green plus button sits half on the pill, half outside to the right */
#gem-pill {
  margin-right: 17px;
  padding-right: 26px;
}

.add {
  position: absolute;
  right: -17px;
  top: 50%;
  width: 34px;
  height: 34px;
  margin-top: -17px;
  padding: 0 0 2px;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 9px;
  background: linear-gradient(180deg, #7bff95 0%, #22c94e 70%);
  box-shadow: 0 3px 0 var(--ink);
  color: #fff;
  font: inherit;
  font-size: 30px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
}
.add:hover { filter: brightness(1.08); }
.add:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* ---------- Left menu ---------- */
#menu {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-46%);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.menu-btn {
  --c: #ffb02e;
  width: 82px;
  min-height: 64px;
  padding: 6px 4px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff) 0%, var(--c) 55%);
  box-shadow: 0 4px 0 var(--ink), 0 6px 0 rgba(0, 0, 0, 0.18);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1;
  text-align: center;
  cursor: pointer;
  transition: transform 80ms ease-out, box-shadow 80ms ease-out;
}

.menu-btn svg {
  width: 28px;
  height: 28px;
  flex: none;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.3));
}

.menu-btn span {
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
}

.menu-btn:hover { transform: translateY(-2px); }
.menu-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink), 0 2px 0 rgba(0, 0, 0, 0.18);
}
.menu-btn:focus-visible, .coin:focus-visible, .close:focus-visible, .add:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.menu-btn[data-id="eggs"] { --c: #ffa726; }
.menu-btn[data-id="pets"] { --c: #ff6fa8; }
.menu-btn[data-id="upgrades"] { --c: #35d366; }
.menu-btn[data-id="shop"] { --c: #a066ff; }
.menu-btn[data-id="index"] { --c: #2fb4ff; }
.menu-btn[data-id="settings"] { --c: #8d9bb3; }


/* ---------- Coins ---------- */
.coin {
  position: absolute;
  left: 0;
  top: 0;
  width: 76px;
  height: 76px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.28));
  touch-action: manipulation;
}

.coin svg { display: block; width: 100%; height: 100%; }

.coin.spawn { animation: spawn 260ms cubic-bezier(0.2, 1.6, 0.4, 1); }
.coin.hit { animation: hit 160ms ease-in forwards; pointer-events: none; }

@keyframes spawn {
  from { transform: scale(0) rotate(-90deg); }
  to { transform: scale(1) rotate(0); }
}
@keyframes hit {
  to { transform: scale(1.55); opacity: 0; }
}

.coin svg { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob {
  50% { transform: translateY(-5px) rotate(4deg); }
}

/* ---------- Floating +1 ---------- */
.float {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  font-size: 28px;
  font-weight: 700;
  color: var(--gold-1);
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
  animation: float-up 700ms ease-out forwards;
}
@keyframes float-up {
  from { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
  25% { transform: translate(-50%, -14px) scale(1.15); }
  to { transform: translate(-50%, -64px) scale(1); opacity: 0; }
}

/* ---------- Window ---------- */
#backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(4, 12, 40, 0.55);
}
#backdrop[hidden] { display: none; }

.window {
  width: min(360px, 100%);
  border: 4px solid var(--ink);
  border-radius: 16px;
  background: #1a4fc4;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
  overflow: hidden;
  animation: spawn 220ms cubic-bezier(0.2, 1.4, 0.4, 1);
}

.window header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 52px;
  background: linear-gradient(180deg, #4aa0ff, #2a78f0);
  border-bottom: 4px solid var(--ink);
}

.window h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  text-wrap: balance;
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
}

.close {
  position: absolute;
  right: 8px;
  top: 50%;
  width: 34px;
  height: 34px;
  margin-top: -17px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 9px;
  background: linear-gradient(180deg, #ff7a6b, #ec3b3b);
  box-shadow: 0 3px 0 var(--ink);
  color: #fff;
  cursor: pointer;
}
.close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.close svg { width: 16px; height: 16px; }

.window .body {
  padding: 28px 20px 30px;
  text-align: center;
  font-size: 18px;
  line-height: 1.35;
}
.window .body small {
  display: block;
  margin-top: 6px;
  font-size: 14px;
  font-weight: 500;
  color: #cfe0ff;
}

/* ---------- Shared window layout ---------- */
.st { -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.window { display: flex; flex-direction: column; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); }
.window header { flex: none; }
.window .body { flex: 1 1 auto; min-height: 0; overflow: auto; }
.window.wide { width: min(720px, 100%); }
.window .body.panel { padding: 14px; text-align: left; font-size: 16px; }

.drop:focus-visible, .ptile:focus-visible, .slot:focus-visible, .arrow:focus-visible,
.chip:focus-visible, .buy:focus-visible, .act:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

/* ---------- HUD extras ---------- */
#gem-timer {
  position: absolute;
  top: 62px;
  right: 0;
  padding: 2px 12px;
  border: 3px solid var(--ink);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
  color: #b6f7ff;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}

#mult {
  position: absolute;
  top: 102px;
  right: 0;
  padding: 3px 12px;
  border: 3px solid var(--ink);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
  color: var(--gold-1);
  font-size: 16px;
  font-weight: 700;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}

/* ---------- Eggs ---------- */
.eggs { display: grid; grid-template-columns: 210px 1fr; gap: 14px; }

.egg-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 10px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.22), rgba(8, 24, 72, 0.45) 70%);
  text-align: center;
}
.egg-name { font-size: 22px; font-weight: 700; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.egg-art svg {
  display: block;
  width: 140px;
  height: 174px;
  filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.28));
  transform-origin: 50% 92%;
  animation: egg-idle 2.2s ease-in-out infinite;
}
@keyframes egg-idle {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

.egg-nav { display: flex; align-items: center; gap: 10px; }
.arrow {
  width: 34px;
  height: 34px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 9px;
  background: linear-gradient(180deg, #5db4ff, #2a78f0);
  box-shadow: 0 3px 0 var(--ink);
  color: #fff;
  cursor: pointer;
}
.arrow:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.arrow svg { width: 16px; height: 16px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); border: 2px solid var(--ink); }
.dots i.on { background: var(--gold-1); }

.drops { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.drops-title { font-size: 18px; font-weight: 700; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.drops-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.drop, .ptile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px 5px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 40%, #0b2468), rgba(8, 24, 72, 0.55));
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
  color: #fff;
  font: inherit;
  cursor: pointer;
  transition: transform 80ms ease-out;
}
.drop:hover, .ptile:hover { transform: translateY(-2px); }
.drop svg, .ptile svg { display: block; width: 56px; height: 56px; }
.drop .pct, .ptile .pm { font-size: 15px; font-weight: 700; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.lim-badge { position: absolute; top: -8px; right: -8px; }
.lim-badge svg { width: 22px; height: 22px; }

.buy-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: auto; padding-top: 6px; }
.buy {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 132px;
  padding: 8px 18px 7px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: linear-gradient(180deg, #7bff95 0%, #22c94e 70%);
  box-shadow: 0 5px 0 var(--ink);
  color: #fff;
  font: inherit;
  cursor: pointer;
}
.buy .buy-t { font-size: 24px; font-weight: 700; line-height: 1; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.buy .buy-p { display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 700; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.buy .buy-p svg { width: 24px; height: 24px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
.buy:hover { filter: brightness(1.06); }
.buy:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.buy.x3 { background: linear-gradient(180deg, #ffd36b 0%, #ff9f1a 70%); }
.buy.poor { background: linear-gradient(180deg, #c3cbdc, #8a95ad); }
.buy.poor .buy-p { color: #ffb0a8; }
.buy.nope, .pill.nope { animation: nope 300ms; }
@keyframes nope {
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ---------- Pets ---------- */
.pets-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.slots { display: flex; gap: 8px; }
.slot {
  position: relative;
  width: 66px;
  height: 66px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 3px dashed rgba(255, 255, 255, 0.45);
  border-radius: 12px;
  background: rgba(8, 24, 72, 0.4);
  color: #fff;
  font: inherit;
}
button.slot {
  border-style: solid;
  border-color: var(--ink);
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 40%, #0b2468), rgba(8, 24, 72, 0.55));
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
  cursor: pointer;
}
.slot svg { display: block; width: 54px; height: 54px; }
.pets-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 15px; text-align: right; }
.pets-stats .big { font-size: 22px; color: var(--gold-1); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }

.sorts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.chip {
  padding: 5px 10px;
  border: 3px solid var(--ink);
  border-radius: 10px;
  background: rgba(8, 24, 72, 0.5);
  box-shadow: 0 2px 0 var(--ink);
  color: #fff;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.chip.on { background: linear-gradient(180deg, #5db4ff, #2a78f0); }

.pet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  align-content: start;
  gap: 10px;
  margin-top: 10px;
  padding: 10px;
  min-height: 110px;
  max-height: min(240px, 34vh);
  overflow: auto;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: rgba(8, 24, 72, 0.35);
}
.ptile.eq { outline: 3px solid #7bff95; outline-offset: -3px; }
.ptile.sel { outline: 3px solid #fff; outline-offset: 2px; }
.ptile .tick {
  position: absolute;
  top: -7px;
  left: -7px;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: #22c94e;
}
.ptile .tick svg { width: 12px; height: 12px; }
.empty { grid-column: 1 / -1; padding: 24px 8px; text-align: center; font-size: 17px; }
.empty small { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: #cfe0ff; }

.pet-detail {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  min-height: 78px;
  margin-top: 10px;
  padding: 8px 10px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: rgba(8, 24, 72, 0.5);
}
.pd-art svg { display: block; width: 56px; height: 56px; }
.pd-info { flex: 1 1 120px; min-width: 0; }
.pd-name { font-size: 19px; font-weight: 700; }
.pd-rar { font-size: 15px; font-weight: 700; }
.pd-mult { font-size: 15px; color: var(--gold-1); }
.pd-type { font-size: 14px; color: #aab4c8; }
.pd-type.lim { color: #ff7ad9; font-weight: 700; }
.pd-btns { display: flex; gap: 8px; }
.pd-hint { width: 100%; text-align: center; font-weight: 500; color: #cfe0ff; }
.pd-note { width: 100%; font-size: 14px; font-weight: 500; color: #ffb0a8; }

.act {
  padding: 8px 16px;
  border: 3px solid var(--ink);
  border-radius: 11px;
  background: linear-gradient(180deg, #5db4ff, #2a78f0);
  box-shadow: 0 4px 0 var(--ink);
  color: #fff;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.act.green { background: linear-gradient(180deg, #7bff95, #22c94e 70%); }
.act.red { background: linear-gradient(180deg, #ff7a6b, #ec3b3b); }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.act.sm { margin-top: 6px; padding: 5px 12px; font-size: 15px; }
.act:disabled { opacity: 0.65; cursor: default; transform: none; }

/* ---------- Tooltip ---------- */
#tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 50;
  min-width: 130px;
  padding: 8px 14px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: #0d2a78;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  text-align: center;
  pointer-events: none;
}
#tip[hidden] { display: none; }
.t-name { font-size: 19px; font-weight: 700; }
.t-rar { font-size: 16px; font-weight: 700; }
.t-mult { font-size: 16px; color: var(--gold-1); }
.t-type { font-size: 14px; color: #aab4c8; }
.t-type.lim { color: #ff7ad9; font-weight: 700; }

/* ---------- Hatch animation ---------- */
@keyframes huespin { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
@keyframes rbegg {
  from { filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.9)) drop-shadow(0 6px 0 rgba(0, 0, 0, 0.3)) hue-rotate(0deg); }
  to { filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.9)) drop-shadow(0 6px 0 rgba(0, 0, 0, 0.3)) hue-rotate(360deg); }
}
.rbw {
  position: relative;
  display: inline-block;
  -webkit-text-stroke: 0;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
}
.rbw::before {
  content: attr(data-t);
  position: absolute;
  left: 0;
  top: 0;
  color: var(--ink);
  -webkit-text-stroke: 5px var(--ink);
}
.rbw > span {
  position: relative;
  -webkit-text-stroke: 0;
  background: linear-gradient(90deg, #ff4d6d, #ff9f1a, #ffe14d, #4dff88, #3dd6ff, #7a8cff, #d46bff, #ff4d6d) 0 0 / 200% 100% repeat-x;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: rbslide 2.2s linear infinite;
}
@keyframes rbslide { to { background-position: 200% 0; } }

/* secret pets get a rainbow tile */
.drop.secret, .ptile.secret, button.slot.secret {
  background: linear-gradient(90deg, rgba(255, 77, 109, 0.65), rgba(255, 159, 26, 0.6), rgba(255, 225, 77, 0.58), rgba(77, 255, 136, 0.58), rgba(61, 214, 255, 0.6), rgba(122, 140, 255, 0.62), rgba(212, 107, 255, 0.65), rgba(255, 77, 109, 0.65)) 0 0 / 200% 100% repeat-x;
  animation: rbslide 2.6s linear infinite;
}

#hatch {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(4, 12, 40, 0.84);
  overflow: auto;
}
#hatch[hidden] { display: none; }
.hatch-stage {
  --s: 200px;
  position: relative;
  width: min(340px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: auto;
  text-align: center;
}
.hatch-stage.n3 { --s: clamp(80px, 22vw, 150px); width: min(680px, 100%); }
.hatch-row { display: flex; justify-content: center; align-items: flex-start; gap: 6px; width: 100%; }
.h-cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 1 0; min-width: 0; }
.h-art { position: relative; width: calc(var(--s) * 1.15); height: calc(var(--s) * 1.15); display: grid; place-items: center; }
.h-art > .hatch-egg, .h-art > .hatch-pet { grid-area: 1 / 1; }
.rays {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--s) * 2.6);
  height: calc(var(--s) * 2.6);
  margin: calc(var(--s) * -1.3) 0 0 calc(var(--s) * -1.3);
  border-radius: 50%;
  background: repeating-conic-gradient(color-mix(in srgb, var(--rc) 60%, transparent) 0 9deg, transparent 9deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 68%);
  mask-image: radial-gradient(circle, #000 0, transparent 68%);
  opacity: 0;
  pointer-events: none;
  animation: spin 8s linear infinite;
}
.h-cell.secret .rays {
  background: repeating-conic-gradient(#ff5a5a 0 10deg, #ffb52e 10deg 20deg, #ffe27a 20deg 30deg, #6dff8a 30deg 40deg, #52c0ff 40deg 50deg, #c98aff 50deg 60deg);
}
.reveal .rays { opacity: 0.9; transition: opacity 300ms; }
@keyframes spin { to { transform: rotate(360deg); } }

.hatch-egg { transform-origin: 50% 92%; }
.hatch-egg svg { display: block; width: calc(var(--s) * 0.75); height: calc(var(--s) * 0.93); filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.3)); }
.hatch-egg.w1 { animation: wob1 900ms ease-in-out infinite; }
.hatch-egg.w2 { animation: wob2 420ms ease-in-out infinite; }
.hatch-egg.w3 { animation: wob3 220ms ease-in-out infinite; }
.hatch-egg.gone { display: none; }
.hatch-egg.rainbow .egg-body { fill: url(#g-rainbow); }
.hatch-egg.rainbow svg { animation: rbegg 700ms linear infinite; }
@keyframes wob1 { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes wob2 { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }
@keyframes wob3 { 0%, 100% { transform: rotate(-15deg) translateX(-3px); } 50% { transform: rotate(15deg) translateX(3px); } }
.cracks path { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.hatch-egg.s2 .c1, .hatch-egg.s3 .c1, .hatch-egg.s3 .c2 { opacity: 1; }

.hatch-pet { opacity: 0; transform: scale(0); }
.hatch-pet svg { display: block; width: var(--s); height: var(--s); filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.3)); }
.reveal .hatch-pet { animation: pop-in 600ms cubic-bezier(0.2, 1.7, 0.4, 1) forwards; }
@keyframes pop-in {
  from { opacity: 1; transform: scale(0) rotate(-40deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

.hatch-info { min-height: 150px; display: flex; flex-direction: column; align-items: center; gap: 1px; opacity: 0; transform: translateY(8px); }
.hatch-info.show { opacity: 1; transform: none; transition: opacity 300ms, transform 300ms; }
.h-new { font-size: 18px; font-weight: 700; color: #7bff95; }
.h-name { font-size: 30px; font-weight: 700; line-height: 1.1; }
.h-rar { font-size: 19px; font-weight: 700; color: var(--rc); }
.h-mult { font-size: 17px; font-weight: 700; color: var(--gold-1); }
.h-type { font-size: 14px; color: #aab4c8; }
.h-type.lim { color: #ff7ad9; font-weight: 700; }
.hatch-stage.n3 .h-name { font-size: clamp(15px, 3.4vw, 22px); }
.hatch-stage.n3 .h-rar { font-size: clamp(13px, 2.8vw, 17px); }
.hatch-stage.n3 .h-mult { font-size: clamp(13px, 2.8vw, 16px); }
.hatch-btns { display: flex; gap: 10px; opacity: 0; pointer-events: none; }
.hatch-btns.show { opacity: 1; pointer-events: auto; transition: opacity 250ms; }

.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash 650ms ease-out; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 0.95; } 100% { opacity: 0; } }

.confetti { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.confetti i {
  position: absolute;
  width: 10px;
  height: 10px;
  border: 2px solid var(--ink);
  border-radius: 2px;
  animation: conf 900ms ease-out forwards;
}
@keyframes conf {
  from { transform: translate(0, 0) rotate(0) scale(0.6); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; }
}

@media (max-width: 600px) {
  .eggs { grid-template-columns: 1fr; }
  .egg-art svg { width: 100px; height: 124px; }
  .slot { width: 58px; height: 58px; }
  .slot svg { width: 46px; height: 46px; }
}

@media (prefers-reduced-motion: reduce) {
  .egg-art svg, .rays, .hatch-egg, .hatch-egg svg, .rbw > span, .drop.secret, .ptile.secret, button.slot.secret { animation: none; }
  .reveal .hatch-pet { animation: none; opacity: 1; transform: none; }
}

/* ---------- Settings toggles ---------- */
.toggles { display: flex; flex-direction: column; gap: 12px; }
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 12px 10px 16px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: rgba(8, 24, 72, 0.5);
  box-shadow: 0 3px 0 var(--ink);
  color: #fff;
  font: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}
.toggle b {
  min-width: 64px;
  padding: 4px 10px;
  border: 3px solid var(--ink);
  border-radius: 9px;
  background: #8d9bb3;
  font-size: 15px;
  font-weight: 700;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
}
.toggle.on b { background: linear-gradient(180deg, #7bff95, #22c94e); }
.toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.toggle:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ---------- Index / unknown pets / rewards ---------- */
.drop.unk { background: linear-gradient(180deg, rgba(120, 150, 210, 0.5), rgba(8, 24, 72, 0.4)); }
.drop.unk svg { filter: brightness(0); }
.rew-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: auto; padding-top: 6px; }
.rew-info { flex: 1 1 150px; min-width: 0; padding: 7px 12px; border: 3px solid var(--ink); border-radius: 12px; background: rgba(8, 24, 72, 0.5); }
.rew-title, .rew-sub { font-size: 13px; font-weight: 500; color: #cfe0ff; }
.rew-line { font-size: 17px; font-weight: 700; color: var(--gold-1); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.rew-info.got .rew-line { color: #7bff95; }
.buy.claim { min-width: 120px; }
.buy.done { background: linear-gradient(180deg, #a9d9b6, #5fa774); cursor: default; filter: none; }
.buy.done:active { transform: none; box-shadow: 0 5px 0 var(--ink); }
.act.wide { width: 100%; margin-top: 14px; }

/* ---------- Auto Collect window ---------- */
.ups { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.up { padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: rgba(8, 24, 72, 0.5); box-shadow: 0 3px 0 var(--ink); }
.up.locked { opacity: 0.6; }
.up-t { font-size: 19px; font-weight: 700; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.up-d { margin: 2px 0 8px; font-size: 14px; font-weight: 500; color: #cfe0ff; }
.up-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.up .buy { min-width: 120px; padding: 6px 14px 5px; }
.up .toggle { width: auto; min-width: 120px; justify-content: center; gap: 10px; padding: 6px 12px; }

/* ---------- Exclusive shop ---------- */
.shop-sec { margin-bottom: 8px; text-align: center; font-size: 22px; font-weight: 700; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.gps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.gp { display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: rgba(8, 24, 72, 0.5); box-shadow: 0 3px 0 var(--ink); }
.gp .buy { width: 100%; min-width: 0; padding: 6px 10px 5px; }

/* ---------- Narrow / short screens ---------- */
@media (max-width: 600px) {
  #hud { gap: 8px; left: 8px; }
  .pill { min-width: 0; flex: 1 1 0; padding-left: 40px; }
  .pill output { font-size: 19px; }
  #gem-pill { padding-right: 24px; }
  .coin { width: 66px; height: 66px; }
}

@media (max-height: 560px) {
  #menu { gap: 6px; transform: translateY(-40%); }
  .menu-btn { width: 70px; min-height: 52px; font-size: 11px; padding: 4px 3px; }
  .menu-btn svg { width: 22px; height: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  body, .coin svg, .coin.spawn, .window, .pill.bump { animation: none; }
  .float { animation-duration: 1ms; animation-delay: 500ms; }
}
</style>

    e.drops.forEach(function (d) { if (d[1] > top) top = d[1]; });

  function bounds(size) {
    var a = arena.getBoundingClientRect();
    var m = menu.getBoundingClientRect();
    var h = hud.getBoundingClientRect();
    var minX = Math.max(0, m.right - a.left + 14);
    var maxX = a.width - size - 4;
    var mb = document.getElementById('gem-timer').getBoundingClientRect();
    var minY = Math.max(h.bottom, mb.bottom) - a.top + 10;
    var maxY = a.height - size - 12;
    if (maxX < minX) minX = Math.max(0, maxX - 10);
    if (maxY < minY) minY = Math.max(0, maxY - 10);
    return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  function place(c) {
    var size = c.el.offsetWidth || 76;
    var b = bounds(size);
    var x = 0, y = 0, tries = 0, ok;
    do {
      x = b.minX + Math.random() * Math.max(0, b.maxX - b.minX);
      y = b.minY + Math.random() * Math.max(0, b.maxY - b.minY);
      ok = true;
      if (c.placed && Math.hypot(x - c.x, y - c.y) < size * 2) ok = false;
      for (var i = 0; i < list.length && ok; i++) {
        var o = list[i];
        if (o !== c && o.placed && Math.hypot(x - o.x, y - o.y) < size * 1.35) ok = false;
      }
      tries++;
    } while (!ok && tries < 40);
    c.x = x;
    c.y = y;
    c.placed = true;
    c.el.style.left = Math.round(x) + 'px';
    c.el.style.top = Math.round(y) + 'px';
    c.el.classList.remove('hit', 'spawn');
    void c.el.offsetWidth;

    f.className = 'float';
    f.textContent = '+' + fmt(n || 1);
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    arena.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 900);
  }

  function collect(c) {
    if (c.busy) return;
    c.busy = true;
    var size = c.el.offsetWidth;
    var gain = Math.round(coinMult() * 100) / 100;
    floater(c.x + size / 2, c.y + size * 0.2, gain);
    coins = Math.round((coins + gain) * 100) / 100;
    sfx('coin');
    render();
    bump();
    save();
    c.el.classList.remove('spawn');
    c.el.classList.add('hit');
    setTimeout(function () {
      place(c);
      c.busy = false;
    }, 170);
  }

  /* ---------- window ---------- */
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function fsOk() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
  function toggleFull() {
    if (fsEl()) {
      var x = document.exitFullscreen || document.webkitExitFullscreen;
      if (x) x.call(document);
    } else {
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); }
    }
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () { refreshToggles(); });
  });

  function refreshToggles() {
    [['music', musicOn], ['sfx', sfxOn], ['full', !!fsEl()], ['confirm', confirmDel], ['float', floatOn], ['auto', autoOn]].forEach(function (x) {
      var t = winBody.querySelector('[data-k="' + x[0] + '"]');
      if (!t) return;
      t.classList.toggle('on', x[1]);
      t.querySelector('b').textContent = x[1] ? 'ON' : 'OFF';
    });
  }

  function buildSettings(note) {
    winBody.innerHTML =
      '<div class="toggles">' +
      '<button type="button" class="toggle" data-k="music"><span>Music</span><b></b></button>' +
      '<button type="button" class="toggle" data-k="sfx"><span>Sound effects</span><b></b></button>' +
      (fsOk() ? '<button type="button" class="toggle" data-k="full"><span>Full Screen</span><b></b></button>' : '') +
      '<button type="button" class="toggle" data-k="confirm"><span>Confirm pet delete</span><b></b></button>' +
      '<button type="button" class="toggle" data-k="float"><span>Coin Popups</span><b></b></button>' +
      '</div>' +
      '<button type="button" class="act red wide" data-act="reset">' + (resetArm ? 'Sure? Tap again' : 'Reset Data') + '</button>' +
      (note ? '<small>' + note + '</small>' : '');
    refreshToggles();
  }

  function buildUpgrades() {
    hideTip();
    var coin = '<svg aria-hidden="true"><use href="#i-coin"/></svg>';
    function priceBtn(act, price) {
      return '<button type="button" class="buy' + (coins < price ? ' poor' : '') + '" data-act="' + act + '"><span class="buy-t">Buy</span><span class="buy-p">' + coin + fmt(price) + '</span></button>';
    }
    var a = autoOwned
      ? '<button type="button" class="toggle" data-k="auto"><span>Auto</span><b></b></button>'
      : priceBtn('buy-auto', AUTO_COST);
    var dots = '';
    for (var i = 0; i < 3; i++) dots += '<i' + (i < speedLvl ? ' class="on"' : '') + '></i>';
    var sp = speedLvl >= 3
      ? '<button type="button" class="buy done" disabled><span class="buy-t">MAX</span></button>'
      : priceBtn('buy-speed', SPEED_COST[speedLvl]);
    winBody.innerHTML = '<div class="ups">' +
      '<div class="up"><div class="up-t">Auto Collect</div><div class="up-d">Collects coins for you, with your multiplier.</div>' +
      '<div class="up-row"><div class="rew-sub">' + (autoOwned ? 'Unlocked' : 'Not bought yet') + '</div>' + a + '</div></div>' +
      '<div class="up' + (autoOwned ? '' : ' locked') + '"><div class="up-t">Speed Upgrade</div>' +
      '<div class="up-d">Collects one coin every ' + (AUTO_MS[speedLvl] / 1000) + 's.' + (autoOwned ? '' : ' Buy Auto Collect first.') + '</div>' +
      '<div class="up-row"><div class="dots">' + dots + '</div>' + (autoOwned ? sp : '') + '</div></div></div>';
    refreshToggles();
  }

  function buildBody(name) {
    if (name === 'Auto Collect') { buildUpgrades(); return; }
    if (name === 'Exclusive Shop') { buildShop(); return; }
    if (name === 'Eggs') { buildEggs(); return; }
    if (name === 'Index') { buildIndex(); return; }
    if (name === 'Pets') { sel = null; delArm = false; petMsg = ''; buildPets(); return; }
    if (name !== 'Settings') {
      winBody.innerHTML = 'Coming soon!<small>This part of the game is not built yet.</small>';
      return;
    }
    resetArm = false;
    buildSettings();
  }

  winBody.addEventListener('click', function (e) {
    var t = e.target.closest('.toggle');
    if (!t) return;
    var k = t.getAttribute('data-k');
    if (k === 'music') setMusic(!musicOn);
    else if (k === 'sfx') setSfx(!sfxOn);
    else if (k === 'full') toggleFull();
    else if (k === 'float') { floatOn = !floatOn; save(); }
    else if (k === 'auto') { autoOn = !autoOn; save(); }
    else { confirmDel = !confirmDel; save(); }
    refreshToggles();
    sfx('click');
  });

  function openWin(name) {
    winTitle.textContent = name;
    var wide = (name === 'Eggs' || name === 'Pets' || name === 'Index' || name === 'Exclusive Shop');
    winEl.classList.toggle('wide', wide);
    winBody.classList.toggle('panel', wide);
    buildBody(name);
    backdrop.hidden = false;
    sfx('open');
    document.getElementById('close').focus();
  }
  function closeWin() {
    if (backdrop.hidden || hatchOpen) return;
    backdrop.hidden = true;
    hideTip();
    sfx('close');
  }

  menu.addEventListener('click', function (e) {
    var btn = e.target.closest('.menu-btn');
    if (!btn) return;
    openWin(btn.querySelector('span').textContent);
  });
  document.getElementById('add').addEventListener('click', function () { openWin('Exclusive Shop'); });
  document.getElementById('close').addEventListener('click', closeWin);
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeWin(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeWin(); });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      list.forEach(function (c) {
        var b = bounds(c.el.offsetWidth || 76);
        if (c.x > b.maxX || c.y > b.maxY || c.x < b.minX || c.y < b.minY) place(c);
      });
    }, 120);
  });

  /* ---------- +1 diamond every minute ---------- */
  var gemTimer = document.getElementById('gem-timer');
  var nextGemAt = Date.now() + 60000;
  function gemTick() {
    var now = Date.now(), got = false;
    while (now >= nextGemAt) { gems += 1; nextGemAt += 60000; got = true; }
    if (got) {
      render();
      save();
      var gp = document.getElementById('gem-pill');
      gp.classList.remove('bump');
      void gp.offsetWidth;
      gp.classList.add('bump');
    }
    var left = Math.max(0, Math.ceil((nextGemAt - now) / 1000));
    gemTimer.textContent = 'Free diamond in ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
  }
  setInterval(gemTick, 1000);
  gemTick();

  /* ---------- auto collect ---------- */
  function autoTick() {
    if (autoOwned && autoOn && !document.hidden) {
      var free = list.filter(function (c) { return c.placed && !c.busy; });
      if (free.length) collect(free[Math.floor(Math.random() * free.length)]);
    }
    setTimeout(autoTick, AUTO_MS[speedLvl]);
  }
  setTimeout(autoTick, AUTO_MS[speedLvl]);

  /* ---------- start ---------- */
  render();
  refreshPetUI();
  for (var i = 0; i < COIN_COUNT; i++) makeCoin(i);
  function placeAll() { list.forEach(function (c) { c.placed = false; }); list.forEach(place); }
  placeAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeAll);
})();
</script>
</body>
</html>
